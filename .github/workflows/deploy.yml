name: Deploy to OVH

# Déclenchement MANUEL par défaut : rien ne part en prod sans une action délibérée.
#   - depuis GitHub : onglet Actions → "Deploy to OVH" → "Run workflow"
#   - depuis un terminal (ou par Claude) : `gh workflow run deploy.yml`
# Pour déployer automatiquement à chaque push sur main, décommenter le bloc `push`.
on:
  workflow_dispatch:
  # Auto-deploy when the site changes (e.g. a merged submission PR). Doc-only
  # changes don't trigger a deploy.
  push:
    branches: [main]
    paths:
      - 'site/**'

# Ne jamais interrompre un envoi FTP en cours (éviterait un déploiement partiel).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ajoute un "required reviewer" sur cet environnement (GitHub → Settings →
    # Environments → production) pour exiger ton approbation avant chaque mise en ligne.
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Cache des données Scryfall du build : évite de re-télécharger chaque carte
      # à chaque déploiement (et ménage l'API Scryfall).
      - uses: actions/cache@v6
        with:
          path: site/.cache/scryfall
          key: scryfall-${{ hashFiles('site/content/**/*.json') }}
          restore-keys: scryfall-

      - name: Install & build
        working-directory: site
        # Variables PUBLIQUES (non secrètes) : clé de site Turnstile + activation
        # des formulaires de soumission. À définir dans Settings → Secrets and
        # variables → Actions → Variables. Absentes = captcha de test + formulaires masqués.
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_SUBMISSIONS_ENABLED: ${{ vars.PUBLIC_SUBMISSIONS_ENABLED }}
        # Le `|| …` contourne le bug npm des dépendances optionnelles (@rolldown)
        # déjà rencontré sur ce dépôt ; sans effet si `npm ci` réussit.
        run: |
          npm ci || { rm -rf node_modules package-lock.json && npm install; }
          npm run build

      # Tests de l'API PHP — bloquent le déploiement s'ils échouent.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: API tests
        working-directory: site
        run: |
          composer install --no-interaction --quiet
          vendor/bin/phpunit

      # Envoi SFTP de dist/ vers la racine web OVH (www/), sur le port 22 avec les
      # mêmes identifiants FTP-SSH. Le mot de passe ne transite plus en clair.
      # delete_remote_files: false -> ne supprime rien côté serveur (ni le cache
      # d'exécution sous api/cache/, ni le .htaccess déjà en place — les dotfiles
      # ne sont pas repris par le glob dist/*, mais ils sont déjà déployés).
      - name: Deploy to OVH (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          port: 22
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local_path: './site/dist/*'
          remote_path: './www/'
          sftp_only: true
          delete_remote_files: false
