name: Deploy (VPS)

# Le site est construit et servi par Dokploy sur le VPS Tolarian, à partir du
# Dockerfile du dépôt (Apache + PHP, cf. DEPLOY.md). Dokploy redéploie seul à
# chaque push sur main, par son application GitHub. Les tests ont déjà tourné sur
# la PR : « build & test » (ci.yml) est requis par le ruleset « Protect main ».
#
# Ce workflow ne fait donc que deux choses :
#   - déclencher un build quand aucun commit ne le fait : le rebuild hebdomadaire
#     et le déclenchement manuel (`gh workflow run deploy.yml`) ;
#   - contrôler la production après chaque déploiement.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Dockerfile'
      - 'docker/**'
  # Le site entier est généré au build, « aujourd'hui » compris : sans rebuild,
  # un tournoi terminé resterait « à venir » jusqu'au prochain push.
  # Lundi 05:00 UTC.
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Webhook de déploiement de l'application Dokploy (URL secrète, contient
      # son jeton). Dokploy n'accepte un appel que s'il ressemble à un push
      # GitHub sur la branche suivie, d'où l'en-tête et le `ref`.
      - name: Déclencher le build Dokploy
        if: github.event_name != 'push'
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_URL" \
            -H 'content-type: application/json' -H 'x-github-event: push' \
            -d '{"ref":"refs/heads/main"}'

      # Un build prend une à deux minutes (cache Scryfall gardé entre deux
      # builds) ; Dokploy ne remplace le conteneur qu'une fois le nouveau prêt.
      - name: Attendre la fin du déploiement
        run: sleep 240

      - name: Contrôle post-déploiement
        run: ./site/scripts/smoke-check.sh
